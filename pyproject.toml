[project]
name = "galley-pdf-fonts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.0,<0.14"] # MIT, Apache-2.0
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "galley_pdf_fonts"

[dependency-groups]
dev = [
    "pytest>=9.1.1", # MIT
    "pyright>=1.1.414", # MIT
    "ruff>=0.16.10", # MIT
    "fonttools>=4.66.1", # MIT
]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
